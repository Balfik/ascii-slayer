name: Keep Supabase project awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
