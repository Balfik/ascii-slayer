name: Auto-cleanup inactive characters

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 3 */5 * *'
    - cron: '0 3 * * 0'
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to run manually (1, 2, 3, or events)'
        required: true
        default: '1'
      dry_run:
        description: 'Dry run — count only, no delete'
        type: boolean
        required: true
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tier and mode
        id: cfg
        run: |
          case "${{ github.event.schedule }}" in
            '0 3 * * *') echo "tier=1" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT" ;;
            '0 3 */5 * *') echo "tier=2" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT" ;;
            '0 3 * * 0') echo "tier=3" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT" ;;
            '0 4 * * 0') echo "tier=events" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "tier=${{ github.event.inputs.tier }}" >> "$GITHUB_OUTPUT"
              echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run cleanup for the selected tier
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIER: ${{ steps.cfg.outputs.tier }}
          DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
        run: |
          set -uo pipefail

          CLOUD_FILTER=""
          if [ "$TIER" != "events" ]; then
            CLOUD_IDS=$(curl -sf "https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/player_saves?select=id" \
              -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}" | jq -r '[.[].id] | join(",")')
            if [ -n "$CLOUD_IDS" ]; then
              CLOUD_FILTER="&id=not.in.(${CLOUD_IDS})"
            fi
          fi

          case "$TIER" in
            1)
              BASE="https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players"
              SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S)
              FILTER="best_level=eq.1&prestige_count=eq.0&is_banned=eq.false&updated_at=lt.${SINCE}${CLOUD_FILTER}"
              LABEL="Tier 1"
              ;;
            2)
              BASE="https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players"
              SINCE=$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%S)
              FILTER="best_level=gt.1&best_level=lt.50&prestige_count=eq.0&is_banned=eq.false&updated_at=lt.${SINCE}${CLOUD_FILTER}"
              LABEL="Tier 2"
              ;;
            3)
              BASE="https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players"
              SINCE=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%S)
              FILTER="best_level=gte.50&best_level=lt.100&prestige_count=eq.0&is_banned=eq.false&updated_at=lt.${SINCE}${CLOUD_FILTER}"
              LABEL="Tier 3"
              ;;
            events)
              BASE="https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/events"
              SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)
              FILTER="created_at=lt.${SINCE}"
              LABEL="Events tier"
              ;;
            *)
              echo "Unknown tier: $TIER"; exit 1 ;;
          esac

          echo "=== $LABEL ==="

          if [ "$DRY_RUN" = "true" ]; then
            COUNT=$(curl -sf "${BASE}?select=id&${FILTER}" \
              -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}" \
              -H "Prefer: count=exact" -H "Range: 0-0" -D - -o /dev/null \
              | grep -i content-range | sed -E 's#.*/##' | tr -d '\r')
            echo "Dry run: would delete ${COUNT:-0} rows."
          else
            RESP=$(curl -sf -X DELETE "${BASE}?${FILTER}" \
              -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}" \
              -H "Prefer: return=representation") || { echo "DELETE failed"; exit 0; }
            COUNT=$(echo "$RESP" | jq 'length')
            echo "Deleted rows: ${COUNT}"
          fi
