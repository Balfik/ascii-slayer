name: Notify Telegram on new players

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new players and notify Telegram
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          SINCE=$(date -u -d '6 minutes ago' +%Y-%m-%dT%H:%M:%S)
          RESP=$(curl -sf "https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players?select=nickname,created_at,referrer,locale,timezone&created_at=gte.${SINCE}&nickname=not.ilike.ZZTest*&order=created_at.asc" \
            -H "apikey: ${SUPABASE_KEY}") || { echo "Supabase query failed"; exit 0; }

          echo "$RESP" | jq -c '.[]' | while read -r row; do
            NICK=$(echo "$row" | jq -r '.nickname')
            CREATED=$(echo "$row" | jq -r '.created_at')
            REFERRER=$(echo "$row" | jq -r '.referrer // empty')
            LOCALE=$(echo "$row" | jq -r '.locale // empty')
            TZ=$(echo "$row" | jq -r '.timezone // empty')
            TIME_FMT=$(date -u -d "$CREATED" +"%Y-%m-%d %H:%M UTC")
            MSG="🆕 Новий гравець: ${NICK}"$'\n'"Час: ${TIME_FMT}"
            if [ -n "$LOCALE" ]; then MSG="${MSG}"$'\n'"Мова: ${LOCALE}"; fi
            if [ -n "$TZ" ]; then MSG="${MSG}"$'\n'"Пояс: ${TZ}"; fi
            if [ -n "$REFERRER" ]; then MSG="${MSG}"$'\n'"Звідки: ${REFERRER}"; fi

            IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
            for CHAT in "${CHATS[@]}"; do
              curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT}" \
                --data-urlencode "text=${MSG}" > /dev/null \
                || echo "Failed to notify chat ${CHAT}"
            done
          done

      - name: Check for auto-banned cheaters and notify Telegram
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          SINCE=$(date -u -d '6 minutes ago' +%Y-%m-%dT%H:%M:%S)
          RESP=$(curl -sf "https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players?select=id,nickname,best_level,castle_level,prestige_count,ban_reason,banned_at,created_at,referrer,locale,timezone&banned_at=gte.${SINCE}&ban_reason=not.is.null&order=banned_at.asc" \
            -H "apikey: ${SUPABASE_KEY}") || { echo "Supabase query failed"; exit 0; }

          echo "$RESP" | jq -c '.[]' | while read -r row; do
            ID=$(echo "$row" | jq -r '.id')
            NICK=$(echo "$row" | jq -r '.nickname')
            LVL=$(echo "$row" | jq -r '.best_level')
            CASTLE=$(echo "$row" | jq -r '.castle_level')
            PRESTIGE=$(echo "$row" | jq -r '.prestige_count')
            REASON=$(echo "$row" | jq -r '.ban_reason')
            CREATED=$(echo "$row" | jq -r '.created_at')
            BANNED=$(echo "$row" | jq -r '.banned_at')
            REFERRER=$(echo "$row" | jq -r '.referrer // "—"')
            LOCALE=$(echo "$row" | jq -r '.locale // "—"')
            TZ=$(echo "$row" | jq -r '.timezone // "—"')
            CREATED_S=$(date -u -d "$CREATED" +%s)
            BANNED_S=$(date -u -d "$BANNED" +%s)
            AGE_MIN=$(( (BANNED_S - CREATED_S) / 60 ))
            MSG="⚠️ Автоматично приховано: ${NICK}"$'\n'"ID: ${ID}"$'\n'"Рівень: ${LVL} · Замок: ${CASTLE} · Переродження: ${PRESTIGE}"$'\n'"Вік акаунта на момент бану: ${AGE_MIN} хв (створено ${CREATED})"$'\n'"Мова/пояс: ${LOCALE} / ${TZ}"$'\n'"Звідки: ${REFERRER}"$'\n'"Причина: ${REASON}"

            IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
            for CHAT in "${CHATS[@]}"; do
              curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT}" \
                --data-urlencode "text=${MSG}" > /dev/null \
                || echo "Failed to notify chat ${CHAT}"
            done
          done

      - name: Check for soft-flagged fast-start accounts and notify Telegram
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          SINCE=$(date -u -d '6 minutes ago' +%Y-%m-%dT%H:%M:%S)
          RESP=$(curl -sf "https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players?select=id,nickname,best_level,created_at,flagged_fast_start_at&flagged_fast_start_at=gte.${SINCE}&order=flagged_fast_start_at.asc" \
            -H "apikey: ${SUPABASE_KEY}") || { echo "Supabase query failed"; exit 0; }

          echo "$RESP" | jq -c '.[]' | while read -r row; do
            ID=$(echo "$row" | jq -r '.id')
            NICK=$(echo "$row" | jq -r '.nickname')
            LVL=$(echo "$row" | jq -r '.best_level')
            CREATED=$(echo "$row" | jq -r '.created_at')
            FLAGGED=$(echo "$row" | jq -r '.flagged_fast_start_at')
            CREATED_S=$(date -u -d "$CREATED" +%s)
            FLAGGED_S=$(date -u -d "$FLAGGED" +%s)
            AGE_SEC=$(( FLAGGED_S - CREATED_S ))
            MSG="🕵️ Підозріло швидкий старт (не забанено, лише перевір): ${NICK}"$'\n'"ID: ${ID}"$'\n'"Рівень: ${LVL} за ${AGE_SEC} сек від створення акаунта"

            IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
            for CHAT in "${CHATS[@]}"; do
              curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT}" \
                --data-urlencode "text=${MSG}" > /dev/null \
                || echo "Failed to notify chat ${CHAT}"
            done
          done

      - name: Check for a registration burst and alert
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          THRESHOLD=50
          SINCE=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S)
          RESP=$(curl -sf "https://vfaveuenkublhxgatbcn.supabase.co/rest/v1/players?select=nickname&created_at=gte.${SINCE}&nickname=not.ilike.ZZTest*&order=created_at.asc" \
            -H "apikey: ${SUPABASE_KEY}") || { echo "Supabase query failed"; exit 0; }

          COUNT=$(echo "$RESP" | jq 'length')
          if [ "$COUNT" -ge "$THRESHOLD" ]; then
            NAMES=$(echo "$RESP" | jq -r '[.[].nickname] | join(", ")')
            MSG="🚨 Можлива атака: ${COUNT} нових акаунтів за останню годину (ліміт ${THRESHOLD})"$'\n'"${NAMES}"

            IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
            for CHAT in "${CHATS[@]}"; do
              curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT}" \
                --data-urlencode "text=${MSG}" > /dev/null \
                || echo "Failed to notify chat ${CHAT}"
            done
          fi
